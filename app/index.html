<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="会話をわかりやすくすることばのサポート">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>ことばの橋</title>
</head>
<body>
  <main class="app-shell" id="appShell">
    <header class="topbar">
      <div class="status-card" aria-live="polite">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">準備できています</span>
      </div>
      <div class="topbar-buttons">
        <button class="icon-button reset-button" id="resetButton" type="button" aria-label="最初から"><img class="action-icon" src="icons/reset.svg" alt="" aria-hidden="true"></button>
      </div>
    </header>

    <section class="partner-zone" aria-labelledby="partnerTitle">
      <div class="partner-zone-row">
        <div class="partner-zone-heading"><p class="eyebrow" id="partnerTitle">相手のことば</p><span class="session-state" id="sessionState">停止中</span></div>
        <button class="button button-listen" id="listenButton" type="button"><img class="action-icon" src="icons/mic.svg" alt="" aria-hidden="true"> 相手の話を聞く</button>
        <button class="button button-stop" id="stopListenButton" type="button" hidden><img class="action-icon" src="icons/stop.svg" alt="" aria-hidden="true"> 止める</button>
      </div>
      <p class="transcript" id="partnerTranscript" hidden></p>
    </section>

    <section class="main-area" id="mainArea" aria-live="polite"></section>

    <!-- Support-request controls (§14). Kept outside the main semantic region so a transient
         view never displaces them. The four requests stay distinct (FR-031). -->
    <section class="support-row" id="supportRow" aria-label="お願いする" hidden></section>

    <section class="bottom-bar" id="bottomBar">
      <button class="speak-button" id="speakButton" type="button">
        <span class="mic-mark" aria-hidden="true"><img class="action-icon action-icon-large" src="icons/mic.svg" alt=""></span>
        <span id="speakLabel">話す</span>
      </button>
      <button class="type-button" id="typeButton" type="button"><img class="action-icon" src="icons/keyboard.svg" alt="" aria-hidden="true"> 文字で入力</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
