<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="会話をわかりやすくする研究用プロトタイプ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>ことばの橋</title>
</head>
<body>
  <main class="app-shell" id="appShell">
    <header class="topbar">
      <div class="status-card" aria-live="polite">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">準備できています</span>
      </div>
      <div class="topbar-buttons">
        <button class="icon-button" id="rotateButton" type="button" aria-label="相手に向けて回転">↻</button>
        <button class="icon-button" id="resetButton" type="button" aria-label="最初から">↺</button>
      </div>
    </header>

    <section class="partner-zone" aria-labelledby="partnerTitle">
      <div class="partner-zone-row">
        <p class="eyebrow" id="partnerTitle">相手が言ったこと</p>
        <span class="session-state" id="sessionState">停止中</span>
        <button class="button button-listen" id="listenButton" type="button"><span aria-hidden="true">🎙</span> 聞く</button>
        <button class="button button-stop" id="stopListenButton" type="button" hidden><span aria-hidden="true">■</span> 止める</button>
      </div>
      <p class="transcript" id="partnerTranscript">ここに相手のことばが出ます。</p>
    </section>

    <section class="main-area" id="mainArea" aria-live="polite"></section>

    <section class="bottom-bar" id="bottomBar">
      <button class="speak-button" id="speakButton" type="button">
        <span class="mic-mark" aria-hidden="true">🎙</span>
        <span id="speakLabel">話して伝える</span>
      </button>
      <button class="type-button" id="typeButton" type="button"><span aria-hidden="true">⌨</span> 文字で伝える</button>
    </section>
  </main>

  <section class="output-overlay" id="outputOverlay" hidden aria-live="polite" aria-label="相手に伝える画面"></section>

  <script src="app.js"></script>
</body>
</html>
