<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="会話をわかりやすくすることばのサポート">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>ことばの橋</title>
</head>
<body>
  <main class="app-shell" id="appShell">
    <header class="topbar">
      <div class="status-card" aria-live="polite">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">準備できています</span>
      </div>
      <div class="topbar-buttons">
        <button class="icon-button reset-button" id="resetButton" type="button" aria-label="最初から"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v6h6"></path></svg></button>
      </div>
    </header>

    <section class="partner-zone" aria-labelledby="partnerTitle">
      <div class="partner-zone-row">
        <div class="partner-zone-heading"><p class="eyebrow" id="partnerTitle">相手のことば</p><span class="session-state" id="sessionState">停止中</span></div>
        <button class="button button-listen" id="listenButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><path d="M12 18v3M8 21h8"></path></svg> 相手の話を聞く</button>
        <button class="button button-stop" id="stopListenButton" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"></rect></svg> 止める</button>
      </div>
      <p class="transcript" id="partnerTranscript" hidden></p>
    </section>

    <section class="main-area" id="mainArea" aria-live="polite"></section>

    <!-- Support-request controls (§14). Deliberately OUTSIDE the main area: the superseded
         expressive flow still replaces that area wholesale, and 短く must not vanish with
         it. Only [短く] exists at this stage; T095 adds もう一回 / ゆっくり / ちがう, which
         stay four distinct controls rather than one generic help button (FR-031). -->
    <section class="support-row" id="supportRow" aria-label="お願いする" hidden></section>

    <section class="bottom-bar" id="bottomBar">
      <button class="speak-button" id="speakButton" type="button">
        <span class="mic-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><path d="M12 18v3M8 21h8"></path></svg></span>
        <span id="speakLabel">話す</span>
      </button>
      <button class="type-button" id="typeButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M6 9h.01M9 9h.01M12 9h.01M15 9h.01M18 9h.01M6 13h12M8 16h8"></path></svg> 文字で入力</button>
    </section>
  </main>

  <section class="output-overlay" id="outputOverlay" hidden aria-live="polite" aria-label="相手に伝える画面"></section>

  <script type="module" src="app.js"></script>
</body>
</html>
