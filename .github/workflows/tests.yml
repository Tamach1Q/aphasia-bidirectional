name: Test app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: node --test tests/unit/*.test.js

      - name: Browser tests
        run: |
          python3 -m http.server 8000 >/tmp/aphasia-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/tests/browser/ >/dev/null; then
              break
            fi
            sleep 0.25
          done

          google-chrome --headless=new --no-sandbox --disable-gpu             --virtual-time-budget=10000             --dump-dom http://127.0.0.1:8000/tests/browser/ > /tmp/browser.html

          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("/tmp/browser.html").read_text()
          failed = re.findall(r'<div class="case fail">', html)
          match = re.search(r'<div id="summary"[^>]*>(\d+)/(\d+) passed</div>', html)
          if not match:
              print(html)
              raise SystemExit("browser test summary was not produced")
          passed, total = map(int, match.groups())
          print(f"browser: {passed}/{total} passed")
          if failed or passed != total:
              print(html)
              raise SystemExit("browser test failure")
          PY
